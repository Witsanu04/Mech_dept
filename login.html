<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | KP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700;900&family=Sarabun:wght@300;400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(34,197,94,0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(59,130,246,0.06) 0%, transparent 45%);
        }

        .eng { font-family: 'Chakra Petch', sans-serif; }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            margin: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 1px 0 rgba(255,255,255,0.8) inset;
            border: 1px solid #f1f5f9;
            animation: fadeUp .5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity:0; transform: translateY(24px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .logo-ring {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            border: 1px solid #bbf7d0;
            box-shadow: 0 8px 20px rgba(34,197,94,0.15);
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 11px; font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: 'Chakra Petch', sans-serif;
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #cbd5e1; font-size: 14px; pointer-events: none;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Sarabun', sans-serif;
            color: #1e293b;
            background: #fafafa;
            outline: none;
            transition: all .2s;
            appearance: none;
        }
        .form-input:focus, .form-select:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.1);
            background: white;
        }

        .pw-toggle {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #cbd5e1; cursor: pointer; font-size: 14px;
            transition: color .2s;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #22c55e;
            color: white;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(34,197,94,0.3);
            transition: all .2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }
        .btn-login:disabled { background: #86efac; cursor: not-allowed; }

        .error-box {
            display: none;
            background: #fef2f2; border: 1px solid #fee2e2;
            border-radius: 12px; padding: 12px 16px;
            color: #dc2626; font-size: 13px;
            align-items: center; gap: 8px;
            margin-top: 12px;
        }
        .error-box.show { display: flex; animation: shake .3s ease; }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-6px)}
            40%{transform:translateX(6px)}
        }

        .divider { border: none; border-top: 1px solid #f1f5f9; margin: 20px 0; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-ring">
        <i class="fa-solid fa-gears text-3xl text-green-500"></i>
    </div>

    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-slate-800 eng tracking-tight">Mechanization</h1>
        <p class="text-slate-400 text-sm mt-1">ระบบบันทึกการเบิก-คืนเครื่องมือ</p>
    </div>

    <div class="form-group">
        <label class="form-label">ชื่อพนักงาน</label>
        <div class="input-wrap">
            <i class="input-icon fa-solid fa-user"></i>
            <select id="staffSelect" class="form-select">
                <option value="" disabled selected>เลือกชื่อของคุณ</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">รหัสพนักงาน</label>
        <div class="input-wrap">
            <i class="input-icon fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-input" placeholder="กรอกรหัสพนักงาน">
            <span class="pw-toggle" onclick="togglePW()">
                <i class="fa-solid fa-eye" id="pwIcon"></i>
            </span>
        </div>
    </div>

    <div class="error-box" id="errorBox">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>รหัสพนักงานไม่ถูกต้อง กรุณาลองใหม่</span>
    </div>

    <button class="btn-login" id="loginBtn" onclick="validateLogin()">
        <span id="btnText">เข้าสู่ระบบ</span>
        <i class="fa-solid fa-arrow-right-to-bracket" id="btnIcon"></i>
    </button>

    <hr class="divider">

    <div class="text-center">
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 text-sm hover:text-slate-600">
            <i class="fa-solid fa-chevron-left text-xs"></i>
            กลับหน้าหลัก
        </a>
    </div>
</div>

<script>
const staffData = [
    { id: "11001111", name: "ADMIN" },
    { id: "1234",     name: "test" },
    { id: "11006598", name: "นายอาณัติ กิตติขจร" },
    { id: "11006699", name: "นายอภิชาติ พูลทอง" },
    { id: "11019685", name: "นายสมควร สายเส็ง" },
    { id: "11020503", name: "นายสิงห์ ร่วมรส" },
    { id: "11029892", name: "นายอดิศักดิ์ เพชรนิล" },
    { id: "11032311", name: "นายสมเจตน์ ไม้หอม" },
    { id: "11033229", name: "นายคมสรรค์ ศรียา" },
    { id: "70003503", name: "นายฉันทพล อินทสิทธิ์" },
    { id: "70015274", name: "นายปริญญา สุบิน" },
    { id: "70040577", name: "นายวุฒิพงษ์ เพ็ชรพราย" },
    { id: "70052194", name: "นายธีรภัทร พิลึก" },
    { id: "70053291", name: "นายวงศกร ระวังภัย" },
    { id: "70080939", name: "นายจาตุพร ขุนพิลึก" },
    { id: "70097946", name: "นายอนิรุธ เกิด" }
];

const select = document.getElementById('staffSelect');
staffData.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = s.name;
    select.appendChild(opt);
});

function togglePW() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('pwIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}

function validateLogin() {
    const name  = document.getElementById('staffSelect').value;
    const pass  = document.getElementById('password').value.trim();
    const error = document.getElementById('errorBox');
    const btn   = document.getElementById('loginBtn');
    const user  = staffData.find(u => u.name === name);

    error.classList.remove('show');

    if (user && user.id === pass) {
        // เปลี่ยนสถานะปุ่ม
        document.getElementById('btnText').textContent = 'กำลังเข้าสู่ระบบ...';
        document.getElementById('btnIcon').className   = 'fa-solid fa-spinner fa-spin';
        btn.disabled = true;

        // บันทึก Session
        sessionStorage.setItem("userName",   user.name);
        sessionStorage.setItem("isLoggedIn", "true");
        // เก็บ Role ไว้เผื่อหน้า index ใช้แยกการแสดงผลปุ่ม
        sessionStorage.setItem("userRole", user.id === "11001111" ? "admin" : "user");

        setTimeout(() => {
            // ─── แก้ไขจุดนี้: เช็กความจำปลายทางที่ฝากมาจากหน้า Select Store ───
            const redirectPage = sessionStorage.getItem("redirectAfterLogin");
            
            if (redirectPage) {
                sessionStorage.removeItem("redirectAfterLogin"); // ล้างความจำเพื่อไม่ให้ค้างในระบบ
                window.location.href = redirectPage; // ส่งผู้ใช้ไปหน้าคลังสินค้าที่เขาเลือกกดมาตั้งแต่แรก
            } else {
                window.location.href = "index.html"; // ถ้าไม่มีข้อมูลฝาก ให้ไปหน้าหลักตามปกติ
            }
        }, 800);
    } else {
        error.classList.add('show');
        document.getElementById('password').value = "";
        document.getElementById('password').focus();
    }
}

document.addEventListener('keypress', e => { if (e.key === 'Enter') validateLogin(); });
</script>

</body>
</html>
