<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | KP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700;900&family=Sarabun:wght@300;400;500;600;700&display=swap');

        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --orange: #f97316;
            --blue: #3b82f6;
            --bg: #f0f4f8;
            --bg-card: #ffffff;
            --bg-nav: #ffffff;
            --bg-hover: #f8fafc;
            --border: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --shadow-nav: 0 10px 25px -5px rgba(0,0,0,0.08);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.04);
            --divider: #f8fafc;
        }
        
        /* ===== แก้ไขเฉพาะโหมด DARK เป็นโทนขาวดำตามคำขอ ===== */
        [data-theme="dark"] {
            --bg: #000000;
            --bg-card: #111111;
            --bg-nav: #111111;
            --bg-hover: rgba(255,255,255,0.05);
            --border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --shadow-nav: 0 10px 25px -5px rgba(0,0,0,0.8);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.5);
            --divider: #222222;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 20%, rgba(34,197,94,0.06) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(249,115,22,0.05) 0%, transparent 50%);
            font-family: 'Sarabun', sans-serif;
            padding-top: 100px;
            min-height: 100vh;
            color: var(--text-primary);
            transition: background .3s, color .3s;
        }
        .eng { font-family: 'Chakra Petch', sans-serif; }

        /* ===== BACK BTN ===== */
        .back-btn {
            position: fixed; top: 22px; left: 20px; width: 45px; height: 45px;
            background: var(--bg-card); border-radius: 12px; display: flex; align-items: center;
            justify-content: center; z-index: 2100;
            box-shadow: var(--shadow-card); border: 1px solid var(--border);
            transition: transform .2s, background .3s;
        }
        .back-btn:hover { transform: scale(1.05); }

        /* ===== DARK TOGGLE ===== */
        .dark-toggle {
            position: fixed; top: 22px; right: 20px; width: 45px; height: 45px;
            background: var(--bg-card); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2100; box-shadow: var(--shadow-card); border: 1px solid var(--border);
            cursor: pointer; transition: transform .2s, background .3s;
        }
        .dark-toggle:hover { transform: scale(1.05); }
        .dark-toggle .icon-sun  { display: none; }
        .dark-toggle .icon-moon { display: block; }
        [data-theme="dark"] .dark-toggle .icon-sun  { display: block; }
        [data-theme="dark"] .dark-toggle .icon-moon { display: none; }

        /* ===== TOP NAV ===== */
        .top-nav-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: var(--bg-nav); height: 60px; padding: 0 8px; border-radius: 0px;
            display: flex; align-items: center; gap: 5px; z-index: 2000;
            box-shadow: var(--shadow-nav); width: fit-content; min-width: 550px;
            border: 1px solid var(--border); transition: background .3s, border .3s;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            display: flex; align-items: center; gap: 8px; color: var(--text-secondary);
            text-decoration: none; font-weight: 500; padding: 10px 15px;
            border-radius: 0px; font-size: 13px; font-family: 'Sarabun', sans-serif;
            transition: all .2s; white-space: nowrap;
        }
        .nav-item:hover { background: var(--bg-hover); }
        .nav-item.active { background: var(--text-primary); color: var(--bg); font-weight: bold; }

        /* ===== BOTTOM NAV (MOBILE) ===== */
        .bottom-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-nav); border-top: 1px solid var(--border);
            z-index: 2000; padding: 8px 0 env(safe-area-inset-bottom, 8px);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            transition: background .3s;
            backdrop-filter: blur(10px);
        }
        .bottom-nav-inner {
            display: flex; justify-content: space-around; align-items: center;
        }
        .bnav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-muted); text-decoration: none;
            font-size: 10px; font-family: 'Sarabun', sans-serif;
            padding: 6px 12px; transition: all .2s; min-width: 56px;
        }
        .bnav-item i { font-size: 18px; }
        .bnav-item.active { color: var(--text-primary); font-weight: bold; }
        /* ===== CARDS ===== */
        .stat-card {
            background: var(--bg-card); border-radius: 20px; padding: 24px;
            box-shadow: var(--shadow-card); border: 1px solid var(--border);
            transition: transform .2s, box-shadow .2s, background .3s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .chart-card {
            background: var(--bg-card); border-radius: 24px; padding: 28px;
            box-shadow: var(--shadow-card); border: 1px solid var(--border);
            transition: background .3s, border .3s;
        }

        .icon-circle {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        .staff-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid var(--divider);
        }
        .staff-row:last-child { border-bottom: none; }
        .staff-avatar {
            width: 34px; height: 34px; border-radius: 10px;
            background: #f0fdf4; color: #16a34a; font-weight: 700; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #dcfce7; font-family: 'Chakra Petch', sans-serif;
        }
        [data-theme="dark"] .staff-avatar { background: rgba(22,163,74,0.15); border-color: rgba(22,163,74,0.25); }

        .pill { padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
        .pill-green  { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }
        .pill-blue   { background: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }
        .pill-red    { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
        .pill-orange { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
        [data-theme="dark"] .pill-green  { background: rgba(22,163,74,0.15);  border-color: rgba(22,163,74,0.25); }
        [data-theme="dark"] .pill-blue   { background: rgba(37,99,235,0.15);  border-color: rgba(37,99,235,0.25); }
        [data-theme="dark"] .pill-orange { background: rgba(234,88,12,0.15);  border-color: rgba(234,88,12,0.25); }

        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .fade-up { animation: fadeUp .5s ease forwards; opacity: 0; }
        .delay-1 { animation-delay: .1s; }
        .delay-2 { animation-delay: .2s; }
        .delay-3 { animation-delay: .3s; }
        .delay-4 { animation-delay: .4s; }

        .pulse { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .section-label {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
        }

        /* refresh btn */
        .refresh-btn {
            display: flex; align-items: center; gap: 2px;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 13px; font-family: 'Sarabun', sans-serif;
            padding: 8px 16px; border-radius: 12px; cursor: pointer;
            transition: background .2s; white-space: nowrap;
        }
        .refresh-btn:hover { background: var(--bg-hover); }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            body { padding-top: 20px; padding-bottom: 80px; }
            .top-nav-bar { display: none !important; }
            .back-btn { display: none; }
            .bottom-nav { display: block; }
            main { padding-left: 16px !important; padding-right: 16px !important; }
            .header-row { flex-wrap: wrap; gap: 10px; }
            h1.page-title { font-size: 22px; }
            .dark-toggle { top: 20px; right: 16px; width: 40px; height: 40px; }
            .chart-card { padding: 18px; }
            .stat-card  { padding: 16px; }
        }
    </style>
</head>
<body>

<a href="javascript:history.back()" class="back-btn">
    <i class="fa-solid fa-chevron-left text-slate-500 text-lg"></i>
</a>

<button class="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode">
    <i class="fa-solid fa-moon text-slate-400 text-base icon-moon"></i>
    <i class="fa-solid fa-sun text-yellow-400 text-base icon-sun"></i>
</button>

<nav class="top-nav-bar">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a>
    <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>สรุปสต็อก</span></a>
    <a href="dashboard-work.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span>สรุปงาน</span></a>
    <a href="working-time.html" class="nav-item"><i class="fa-solid fa-user-clock"></i><span>บันทึกเวลา</span></a>

</nav>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="bnav-item"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a>
        <a href="dashboard.html" class="bnav-item"><i class="fa-solid fa-chart-line"></i><span>สรุปสต็อก</span></a>
        <a href="dashboard-work.html" class="bnav-item active"><i class="fa-solid fa-chart-pie"></i><span>สรุปงาน</span></a>
        <a href="working-time.html" class="bnav-item"><i class="fa-solid fa-user-clock"></i><span>บันทึกเวลา</span></a>

</nav>
<main class="max-w-6xl mx-auto px-6 pb-12">

    <div class="flex justify-between items-end mb-8 fade-up header-row">
        <div>
            <p class="section-label">KP System · ภาพรวม</p>
            <h1 class="text-3xl font-black eng page-title" style="color:var(--text-primary)">Dashboard</h1>
            <p class="text-sm mt-1" style="color:var(--text-muted)" id="todayLabel">กำลังโหลด...</p>
        </div>
        <button onclick="loadAll()" class="refresh-btn">
            <i class="fa-solid fa-rotate-right mr-2" id="refreshIcon"></i> รีเฟรช
        </button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card fade-up delay-1">
            <div class="icon-circle bg-green-50 mb-3"><i class="fa-solid fa-check-double text-green-500"></i></div>
            <div class="text-3xl font-black eng" style="color:var(--text-primary)" id="statDone">—</div>
            <div class="text-sm mt-1" style="color:var(--text-muted)">เสร็จแล้ววันนี้</div>
        </div>
        <div class="stat-card fade-up delay-2">
            <div class="icon-circle bg-blue-50 mb-3"><i class="fa-solid fa-spinner text-blue-500"></i></div>
            <div class="text-3xl font-black eng" style="color:var(--text-primary)" id="statWeek">—</div>
            <div class="text-sm mt-1" style="color:var(--text-muted)">งานสัปดาห์นี้</div>
        </div>
        <div class="stat-card fade-up delay-3">
            <div class="icon-circle bg-orange-50 mb-3"><i class="fa-solid fa-users text-orange-500"></i></div>
            <div class="text-3xl font-black eng" style="color:var(--text-primary)" id="statStaff">—</div>
            <div class="text-sm mt-1" style="color:var(--text-muted)">พนักงานทั้งหมด</div>
        </div>
        <div class="stat-card fade-up delay-4">
            <div class="icon-circle bg-purple-50 mb-3"><i class="fa-solid fa-list-check text-purple-500"></i></div>
            <div class="text-3xl font-black eng" style="color:var(--text-primary)" id="statTotal">—</div>
            <div class="text-sm mt-1" style="color:var(--text-muted)">งานทั้งหมด</div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="chart-card fade-up delay-2">
            <p class="section-label">งานรายวัน — สัปดาห์นี้</p>
            <canvas id="chartDaily" height="180"></canvas>
        </div>
        <div class="chart-card fade-up delay-3">
            <p class="section-label">สัดส่วนสถานะงาน</p>
            <div class="flex items-center gap-6">
                <div style="width:160px;height:160px;flex-shrink:0">
                    <canvas id="chartStatus"></canvas>
                </div>
                <div id="statusLegend" class="flex flex-col gap-3 flex-1"></div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="chart-card fade-up delay-3">
            <p class="section-label">ภาระงาน — แต่ละคน</p>
            <canvas id="chartStaff" height="200"></canvas>
        </div>
        <div class="chart-card fade-up delay-4">
            <div class="flex justify-between items-center mb-4">
                <p class="section-label mb-0">งานวันนี้</p>
                <span class="pill pill-green" id="todayCount">0 งาน</span>
            </div>
            <div id="todayList" class="space-y-1 max-h-64 overflow-y-auto pr-1">
                <div class="text-sm text-center py-8 pulse" style="color:var(--text-muted)">กำลังโหลด...</div>
            </div>
        </div>
    </div>

</main>

<script>
const sheetID   = "1UxmUNVVnq-R16c14SWFjMRI7lQviYkZYB44SH5qlj3A";
const sheetName = "Plan L3";
const url       = `https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(sheetName)}`;

let chartDaily, chartStatus, chartStaff;

// ===== DARK MODE =====
function toggleDark() {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    // Redraw charts with new colors
    if (chartDaily || chartStatus || chartStaff) setTimeout(loadAll, 100);
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', 'dark');
})();

function getChartColors() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
        grid: dark ? '#1e293b' : '#f1f5f9',
        tick: dark ? '#475569' : '#94a3b8',
        legend: dark ? '#94a3b8' : '#64748b',
    };
}

// ===== HELPERS =====
function parseTHDate(str) {
    if (!str) return null;
    const parts = str.split('/');
    if (parts.length !== 3) return null;
    let [d, m, y] = parts.map(Number);
    if (y > 2500) y -= 543;
    return new Date(y, m - 1, d);
}
function formatTHDate(d) {
    const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function getWeekRange() {
    const now = new Date(), day = now.getDay();
    const mon = new Date(now); mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { mon, sun };
}
function isSameDay(a, b) {
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function isThisWeek(d) {
    if (!d) return false;
    const {mon, sun} = getWeekRange();
    return d >= mon && d <= sun;
}
const COLORS = ['#22c55e','#3b82f6','#f97316','#a855f7','#14b8a6','#f43f5e','#eab308','#6366f1'];

async function loadAll() {
    document.getElementById('refreshIcon').classList.add('fa-spin');
    const now = new Date();
    document.getElementById('todayLabel').textContent = `อัปเดตล่าสุด: ${formatTHDate(now)} — ${now.toLocaleTimeString('th-TH')}`;
    try {
        const res  = await fetch(url);
        const data = await res.json();
        const rows = data.filter(r => r['ชื่อพนักงาน'] && r['ชื่อพนักงาน'] !== 'ชื่อพนักงาน');
        renderStats(rows);
        renderDailyChart(rows);
        renderStatusChart(rows);
        renderStaffChart(rows);
        renderTodayList(rows);
    } catch(e) {
        document.getElementById('todayLabel').textContent = '⚠️ โหลดไม่สำเร็จ';
    }
    document.getElementById('refreshIcon').classList.remove('fa-spin');
}

function renderStats(rows) {
    const today = new Date();
    const todayRows = rows.filter(r => isSameDay(parseTHDate(r['วันที่สำเร็จจริง']), today) || isSameDay(parseTHDate(r['วันที่เริ่มต้น']), today));
    const weekRows  = rows.filter(r => isThisWeek(parseTHDate(r['วันที่เริ่มต้น'])) || isThisWeek(parseTHDate(r['วันที่สำเร็จจริง'])));
    const doneToday = todayRows.filter(r => (r['Status']||'').toLowerCase().includes('complate') || (r['Status']||'').toLowerCase().includes('done'));
    const staffSet  = new Set(rows.map(r => r['ชื่อพนักงาน']));
    animateNumber('statDone',  doneToday.length);
    animateNumber('statWeek',  weekRows.length);
    animateNumber('statStaff', staffSet.size);
    animateNumber('statTotal', rows.length);
}

function animateNumber(id, target) {
    const el = document.getElementById(id);
    let cur = 0; const step = Math.ceil(target / 20);
    const timer = setInterval(() => {
        cur = Math.min(cur + step, target);
        el.textContent = cur;
        if (cur >= target) clearInterval(timer);
    }, 40);
}

function renderDailyChart(rows) {
    const {mon} = getWeekRange();
    const days = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
    const counts = Array(7).fill(0), done = Array(7).fill(0);
    rows.forEach(r => {
        const d = parseTHDate(r['วันที่เริ่มต้น']);
        if (!d) return;
        const diff = Math.floor((d - mon) / 86400000);
        if (diff >= 0 && diff < 7) {
            counts[diff]++;
            if ((r['Status']||'').toLowerCase().includes('complate') || (r['Status']||'').toLowerCase().includes('done')) done[diff]++;
        }
    });
    const c = getChartColors();
    if (chartDaily) chartDaily.destroy();
    chartDaily = new Chart(document.getElementById('chartDaily'), {
        type: 'bar',
        data: {
            labels: days,
            datasets: [
                { label: 'งานทั้งหมด', data: counts, backgroundColor: 'rgba(59,130,246,0.15)', borderColor: '#3b82f6', borderWidth: 2, borderRadius: 8 },
                { label: 'เสร็จแล้ว',  data: done,   backgroundColor: 'rgba(34,197,94,0.8)',   borderColor: '#16a34a', borderWidth: 0, borderRadius: 8 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: true,
            plugins: { legend: { position: 'bottom', labels: { color: c.legend, font: { family:'Sarabun', size:12 }, boxWidth:12 } } },
            scales: {
                x: { grid: { display:false }, ticks: { color: c.tick, font:{ family:'Sarabun' } } },
                y: { grid: { color: c.grid }, ticks: { color: c.tick, font:{ family:'Sarabun' }, stepSize:1 } }
            }
        }
    });
}

function renderStatusChart(rows) {
    const counts = {};
    rows.forEach(r => { const s = r['Status'] || 'Pending'; counts[s] = (counts[s]||0) + 1; });
    const labels = Object.keys(counts), values = Object.values(counts);
    const total = values.reduce((a,b)=>a+b,0);
    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(document.getElementById('chartStatus'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 0, hoverOffset: 6 }] },
        options: { responsive:true, cutout:'72%', plugins:{ legend:{display:false} } }
    });
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('statusLegend').innerHTML = labels.map((l,i) => `
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full flex-shrink-0" style="background:${COLORS[i%COLORS.length]}"></div>
                <span class="text-sm" style="color:var(--text-secondary)">${l}</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="font-bold eng" style="color:var(--text-primary)">${counts[l]}</span>
                <span class="text-xs" style="color:var(--text-muted)">${Math.round(counts[l]/total*100)}%</span>
            </div>
        </div>`).join('');
}

function renderStaffChart(rows) {
    const staffCounts = {}, staffDone = {};
    rows.forEach(r => {
        const s = r['ชื่อพนักงาน']; if (!s) return;
        staffCounts[s] = (staffCounts[s]||0) + 1;
        if ((r['Status']||'').toLowerCase().includes('complate') || (r['Status']||'').toLowerCase().includes('done'))
            staffDone[s] = (staffDone[s]||0) + 1;
    });
    const names = Object.keys(staffCounts).sort((a,b) => staffCounts[b]-staffCounts[a]).slice(0,10);
    const c = getChartColors();
    if (chartStaff) chartStaff.destroy();
    chartStaff = new Chart(document.getElementById('chartStaff'), {
        type: 'bar',
        data: {
            labels: names,
            datasets: [
                { label:'งานทั้งหมด', data: names.map(n=>staffCounts[n]), backgroundColor:'rgba(249,115,22,0.2)', borderColor:'#f97316', borderWidth:2, borderRadius:6 },
                { label:'เสร็จแล้ว',  data: names.map(n=>staffDone[n]||0), backgroundColor:'rgba(34,197,94,0.8)',  borderColor:'#16a34a', borderWidth:0, borderRadius:6 }
            ]
        },
        options: {
            indexAxis:'y', responsive:true, maintainAspectRatio:true,
            plugins: { legend:{ position:'bottom', labels:{ color: c.legend, font:{family:'Sarabun',size:12}, boxWidth:12 } } },
            scales: {
                x: { grid:{color: c.grid}, ticks:{color: c.tick, font:{family:'Sarabun'}, stepSize:1} },
                y: { grid:{display:false}, ticks:{color: c.tick, font:{family:'Sarabun', size:12}} }
            }
        }
    });
}

function renderTodayList(rows) {
    const today = new Date();
    const todayRows = rows.filter(r =>
        isSameDay(parseTHDate(r['วันที่เริ่มต้น']), today) ||
        isSameDay(parseTHDate(r['วันที่สำเร็จจริง']), today)
    );
    document.getElementById('todayCount').textContent = `${todayRows.length} งาน`;
    const list = document.getElementById('todayList');
    if (todayRows.length === 0) {
        list.innerHTML = `<div class="text-sm text-center py-8" style="color:var(--text-muted)">ไม่มีงานวันนี้</div>`;
        return;
    }
    list.innerHTML = todayRows.map(r => {
        const s = r['Status'] || 'Pending';
        const isDone = s.toLowerCase().includes('complate') || s.toLowerCase().includes('done');
        return `
        <div class="staff-row">
            <div class="flex items-center gap-3">
                <div class="staff-avatar">${(r['ชื่อพนักงาน']||'').substring(0,2)}</div>
                <div>
                    <div class="text-sm font-semibold" style="color:var(--text-primary)">${r['ชื่อพนักงาน']||''}</div>
                    <div class="text-xs" style="color:var(--text-muted)">${r['Project']||''}</div>
                </div>
            </div>
            <span class="pill ${isDone ? 'pill-green' : 'pill-blue'}">${s}</span>
        </div>`;
    }).join('');
}

window.onload = loadAll;
</script>
</body>
