<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Records | Mechanization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');

        :root {
            --green: #22c55e;
            --bg: #000000;
            --bg-card: #111111;
            --bg-nav: #111111;
            --bg-input: #000000;
            --bg-hover: rgba(255,255,255,0.05);
            --bg-thead: #1a1a1a;
            --border: #222222;
            --border-input: #222222;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.5);
            --shadow-nav: 0 10px 25px -5px rgba(0,0,0,0.8);
            --divider: #222222;
        }

        body {
            background: var(--bg);
            font-family: 'Sarabun', sans-serif;
            padding-top: 100px;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .top-nav-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: var(--bg-nav); height: 50px; padding: 0 8px; border-radius: 12px;
            display: flex; align-items: center; gap: 5px; z-index: 2000;
            box-shadow: var(--shadow-nav); width: fit-content; border: 1px solid var(--border);
        }
        .nav-item {
            display: flex; align-items: center; gap: 8px; color: var(--text-secondary);
            text-decoration: none; font-weight: 500; padding: 6px 14px;
            border-radius: 8px; font-size: 13px; transition: all .2s;
        }
        .nav-item.active { background: #ffffff; color: #000000; font-weight: bold; }

        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-nav); border-top: 1px solid var(--border);
            z-index: 2000; padding: 8px 0 env(safe-area-inset-bottom, 8px);
        }
        .bottom-nav-inner { display: flex; justify-content: space-around; align-items: center; }
        .bnav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-muted); text-decoration: none; font-size: 10px; min-width: 56px;
        }
        .bnav-item.active { color: var(--text-primary); font-weight: bold; }

        .glass-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .work-table th { background: var(--bg-thead); color: var(--text-muted); font-size: 11px; padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; }
        .work-table td { padding: 12px 16px; border-bottom: 1px solid var(--divider); font-size: 13px; }
        .work-table tr:hover td { background: var(--bg-hover); }
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .status-done { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-pending { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .status-progress { background: rgba(245,158,11,0.15); color: #f59e0b; }

        .work-cards { display: none; }
        .work-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 9000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-box {
            background: #111111; border-radius: 16px; padding: 20px;
            width: 92%; max-width: 440px; border: 1px solid #222222;
            max-height: 85vh; overflow-y: auto; transform: scale(0.95); transition: transform .2s;
        }
        .modal-overlay.open .modal-box { transform: scale(1); }

        .form-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
        .form-input, .form-select {
            width: 100%; border: 1px solid #222222; border-radius: 8px;
            padding: 10px 12px; font-size: 14px; background: #000000; color: #ffffff; outline: none;
        }
        .form-input:focus, .form-select:focus { border-color: var(--green); }

        input[type="date"] { position: relative; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            width: auto; height: auto; background: transparent; color: transparent; cursor: pointer;
        }

        .fab {
            display: none; position: fixed; bottom: 80px; right: 16px;
            width: 50px; height: 50px; background: var(--green); border-radius: 50%;
            align-items: center; justify-content: center; z-index: 1500; box-shadow: 0 4px 15px rgba(34,197,94,0.3);
        }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #222222; color: white; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; z-index: 9999; transition: transform .3s; border: 1px solid #333333;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            body { padding-top: 15px; padding-bottom: 75px; }
            .top-nav-bar, .add-btn-desktop, .work-table-wrap { display: none !important; }
            .bottom-nav, .fab, .work-cards { display: block; }
            .modal-overlay { align-items: center; }
            .modal-box { padding: 16px; width: 95%; }
        }
    </style>
</head>
<body>

<nav class="top-nav-bar">
    <a href="index.html" class="nav-item">หน้าแรก</a>
    <a href="dashboard.html" class="nav-item">สรุปสต็อก</a>
    <a href="dashboard-work.html" class="nav-item">สรุปงาน</a>
    <a href="working-time.html" class="nav-item active">บันทึกเวลา</a>
    <a href="inventory-select.html" class="nav-item">จัดการสต็อก</a>
</nav>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="bnav-item"><span>หน้าแรก</span></a>
        <a href="dashboard.html" class="bnav-item"><span>สรุปสต็อก</span></a>
        <a href="dashboard-work.html" class="bnav-item"><span>สรุปงาน</span></a>
        <a href="working-time.html" class="bnav-item active"><span>บันทึกเวลา</span></a>
        <a href="inventory-select.html" class="bnav-item"><span>จัดการสต็อก</span></a>
    </div>
</nav>

<button class="fab" onclick="openModal()"><i class="fa-solid fa-plus text-white"></i></button>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-box">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-white">บันทึกงานใหม่</h2>
            <button onclick="closeModalDirect()" class="text-gray-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="form-label">ชื่อพนักงาน</label>
                <select id="fStaff" class="form-select">
                    <option value="">— เลือกพนักงาน —</option>
                    <option>Parinya</option><option>Wuttipong</option><option>Jatuporn</option>
                    <option>Chantapol</option><option>KHETTAWAN</option><option>test</option>
                </select>
            </div>
            <div>
                <label class="form-label">Project</label>
                <input id="fProject" type="text" class="form-input" placeholder="ชื่อ Project...">
            </div>
            <div>
                <label class="form-label">รายละเอียดงาน</label>
                <input id="fDetail" type="text" class="form-input" placeholder="อธิบายงานที่ทำ...">
            </div>
            <div>
                <label class="form-label">มอบหมายโดย</label>
                <select id="fAssign" class="form-select">
                    <option value="">— เลือก —</option>
                    <option>Somkuan</option><option>Wongskorn</option><option>Sing</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="form-label">กำหนดแล้วเสร็จ</label>
                    <input id="fDueDate" type="date" class="form-input">
                </div>
                <div>
                    <label class="form-label">วันที่แล้วเสร็จจริง</label>
                    <input id="fActualDate" type="date" class="form-input">
                </div>
            </div>
            <div>
                <label class="form-label">สถานะ</label>
                <select id="fStatus" class="form-select">
                    <option value="Pending">Pending</option>
                    <option value="Complete">Complete</option>
                    <option value="In Progress">In Progress</option>
                </select>
            </div>
        </div>
        <div class="mt-5 flex gap-2">
            <button onclick="closeModalDirect()" class="flex-1 py-2 rounded bg-neutral-900 text-sm text-gray-400">ยกเลิก</button>
            <button onclick="submitForm()" id="submitBtn" class="flex-1 py-2 rounded bg-green-500 text-sm text-black font-bold">บันทึกงาน</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<main class="max-w-6xl mx-auto px-4 mt-4">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-bold text-white">Work Records</h1>
            <p class="text-xs text-gray-500" id="loadStatus">กำลังโหลดข้อมูล...</p>
        </div>
        <button onclick="openModal()" class="add-btn-desktop bg-green-500 text-black font-bold px-4 py-2 rounded-lg text-sm">
            + ลงงาน
        </button>
    </div>

    <div class="glass-card work-table-wrap">
        <table class="w-full work-table">
            <thead>
                <tr>
                    <th class="w-16 text-center">Week</th>
                    <th>พนักงาน</th>
                    <th>Project</th>
                    <th>รายละเอียดงาน</th>
                    <th>มอบหมายโดย</th>
                    <th>กำหนดเสร็จ</th>
                    <th>เสร็จจริง</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody id="workTableBody"></tbody>
        </table>
    </div>

    <div class="work-cards" id="workCards"></div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyNUAU26rjkmP-t7Y-pJ0MA7RBhLh5EnA2fklGfn1SDhThXlS_fzeQ0Lt89HoNqb0XXjg/exec";
let allData = [];

async function loadWorkData() {
    try {
        const res = await fetch(`${GAS_URL}?t=${new Date().getTime()}`);
        allData = await res.json();
        document.getElementById("loadStatus").textContent = `รายการทั้งหมด: ${allData.length} แถว`;
        renderTable(allData);
        renderCards(allData);
    } catch(e) {
        document.getElementById("loadStatus").textContent = "⚠️ โหลดข้อมูลล้มเหลว";
    }
}

function renderTable(data) {
    const tbody = document.getElementById("workTableBody");
    tbody.innerHTML = "";
    if(!data.length) { tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-500">ไม่มีข้อมูล</td></tr>`; return; }
    
    data.forEach(row => {
        const badge = getStatusBadge(row.status);
        tbody.innerHTML += `<tr>
            <td class="text-center text-gray-500">${row.week || '-'}</td>
            <td class="font-bold text-white">${row.employeeName || '-'}</td>
            <td class="text-green-400 font-semibold">${row.project || '-'}</td>
            <td class="text-gray-300">${row.taskDetail || '-'}</td>
            <td class="text-gray-300">${row.assignedBy || '-'}</td>
            <td class="text-gray-400 text-xs">${row.dueDate || '-'}</td>
            <td class="text-gray-400 text-xs">${row.actualDate || '-'}</td>
            <td><span class="status-badge ${badge.cls}">${row.status || 'Pending'}</span></td>
        </tr>`;
    });
}

function renderCards(data) {
    const container = document.getElementById("workCards");
    container.innerHTML = "";
    if(!data.length) { container.innerHTML = `<div class="text-center py-8 text-gray-500">ไม่มีข้อมูล</div>`; return; }
    
    data.forEach(row => {
        const badge = getStatusBadge(row.status);
        container.innerHTML += `<div class="work-card">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="font-bold text-white text-sm">${row.employeeName || '-'}</div>
                    <div class="text-xs text-green-400 font-semibold">${row.project || '-'}</div>
                </div>
                <span class="status-badge ${badge.cls}">${row.status || 'Pending'}</span>
            </div>
            <div class="text-xs text-gray-400 space-y-1">
                <div><span class="text-gray-600">งาน:</span> ${row.taskDetail || '-'}</div>
                <div class="grid grid-cols-2 gap-1 mt-1">
                    <div><span class="text-gray-600">โดย:</span> ${row.assignedBy || '-'}</div>
                    <div><span class="text-gray-600">Week:</span> ${row.week || '-'}</div>
                    <div><span class="text-gray-600">กำหนด:</span> ${row.dueDate || '-'}</div>
                    <div><span class="text-gray-600">เสร็จจริง:</span> ${row.actualDate || '-'}</div>
                </div>
            </div>
        </div>`;
    });
}

function getStatusBadge(status) {
    const s = String(status || '').toLowerCase();
    if(s.includes('complete')) return { cls: 'status-done' };
    if(s.includes('progress')) return { cls: 'status-progress' };
    return { cls: 'status-pending' };
}

async function submitForm() {
    const staff = document.getElementById('fStaff').value;
    const project = document.getElementById('fProject').value;
    const detail = document.getElementById('fDetail').value;
    const assign = document.getElementById('fAssign').value;
    const dueDate = document.getElementById('fDueDate').value;
    const actualDate = document.getElementById('fActualDate').value;
    const status = document.getElementById('fStatus').value;

    if(!staff || !project) { showToast('⚠️ ระบุชื่อพนักงานและโปรเจกต์'); return; }

    const payload = { employeeName: staff, project, taskDetail: detail, assignedBy: assign, dueDate, actualDate, status };
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = "กำลังบันทึก...";

    try {
        await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        showToast('✅ บันทึกสำเร็จ!');
        closeModalDirect();
        setTimeout(loadWorkData, 1200);
    } catch(e) {
        showToast('❌ ผิดพลาด');
    } finally {
        btn.disabled = false; btn.textContent = "บันทึกงาน";
    }
}

function openModal() {
    const now = new Date();
    const offsetMs = now.getTimezoneOffset() * 60000;
    const localToday = new Date(now.getTime() - offsetMs).toISOString().split('T')[0];
    document.getElementById('fDueDate').value = localToday;
    document.getElementById('fActualDate').value = "";
    document.getElementById('modalOverlay').classList.add('open');
}
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModal(e) { if(e.target.id === 'modalOverlay') closeModalDirect(); }
function showToast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

window.onload = loadWorkData;
</script>
</body>
</html>
